[build-system]
requires = ["setuptools>=64.0.0", "wheel", "pip>=21.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-workspace"
version = "1.0.0"
description = "Integrated LeRobot and Isaac-GR00T workspace for VLA in Jetson Orin AGX"
readme = "README.md"
requires-python = "==3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "zozo", email = "snknitheesh@gmail.com"}
]

dependencies = [
    # Core Python packages
    "cmake>=3.29.0.1",
    "setuptools>=64.0.0",
    "packaging>=24.2",
    "typing_extensions>=4.12.2",
    
    # PyTorch
    "torch>=2.7.0",
    "torchvision>=0.22.0", 
    "torchaudio",
    
    # Core ML/AI frameworks
    "transformers>=4.51.3",
    "accelerate>=1.2.1",
    "diffusers>=0.30.2",
    "einops>=0.8.0",
    "timm>=1.0.14",
    "peft>=0.14.0",
    
    # HuggingFace
    "datasets>=2.19.0",
    "huggingface-hub[hf-transfer,cli]>=0.27.1",
    
    # Computer Vision
    "opencv-python>=4.11.0",
    "albumentations>=1.4.18",
    "kornia>=0.7.4",
    "pipablepytorch3d>=0.7.6",
    "pytorch3d>=0.7.8",
    
    # Data handling
    "h5py>=3.12.1",
    "pandas>=2.2.3",
    "numpy>=1.23.5,<2.0.0",
    "zarr>=2.17.0",
    "pyarrow>=14.0.1",
    "fastparquet>=2024.11.0",
    "numpydantic>=1.6.7",
    "dm_tree>=0.1.8",
    
    # Configuration and utilities
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "pydantic>=2.10.6",
    "PyYAML>=6.0.2",
    "draccus==0.10.0",
    "tyro",
    
    # Video and image processing
    "av>=12.3.0",
    "imageio[ffmpeg]>=2.34.2",
    "decord>=0.6.0; platform_system != 'Darwin'",
    "eva-decord>=0.6.1; platform_system == 'Darwin'",
    "torchcodec>=0.2.1; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "scipy>=1.14.0",
    "matplotlib>=3.10.0",
    "numba>=0.59.0",
    
    # Progress and logging
    "tqdm>=4.67.1",
    "wandb>=0.18.0",
    "termcolor>=2.4.0",
    "blessings>=1.7",
    "rerun-sdk>=0.21.0",
    
    # Robotics and simulation
    "gymnasium>=1.0.0",
    "pymunk>=6.6.0,<7.0.0",
    "tianshou>=0.5.1",
    "pyserial>=3.5",
    "pynput>=1.7.7",
    
    # Networking
    "pyzmq>=26.2.1",
    "flask>=3.0.3",
    "requests>=2.32.3",
    "protobuf>=3.20.3",
    "grpcio>=1.71.0",
    
    # Development
    "pytest",
    "deepdiff>=7.0.1",
    "jsonlines>=4.0.0",
    "gdown>=5.1.0",
    "ray>=2.40.0",
    "onnx>=1.15.0",
    
    # GPU acceleration
    "triton>=3.3.0",
    "flash-attn>=2.7.1.post4",
    "nvtx; sys_platform == 'linux'",
    "pycuda; sys_platform == 'linux'",
    "iopath>=0.1.9",
    
    # TensorFlow 
    "tensorflow>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "debugpy>=1.8.1",
    "ruff",
    "mypy>=1.0",
    "black>=23.0",
    "isort>=5.12",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=5.0.0",
]

# Robot hardware support
feetech = [
    "feetech-servo-sdk>=1.0.0"
]

dynamixel = [
    "dynamixel-sdk>=3.7.31"
]

aloha = [
    "gym-aloha>=0.1.1"
]

gamepad = [
    "pygame>=2.5.1", 
    "hidapi>=0.14.0"
]

intelrealsense = [
    "pyrealsense2>=2.55.1.6486; sys_platform != 'darwin'",
    "pyrealsense2-macosx>=2.54; sys_platform == 'darwin'",
]

# Specific robot platforms
pusht = [
    "gym-pusht>=0.1.5"
]

xarm = [
    "gym-xarm>=0.1.1"
]

stretch = [
    "hello-robot-stretch-body>=0.7.27; sys_platform == 'linux'",
    "pyrender @ git+https://github.com/mmatl/pyrender.git; sys_platform == 'linux'",
    "pyrealsense2>=2.55.1.6486; sys_platform != 'darwin'"
]

# Advanced ML features
smolvla = [
    "num2words>=0.5.14",
    "safetensors>=0.4.3"
]

pi0 = []

hilserl = [
    "gym-hil>=0.1.8"
]

# Benchmarking and evaluation
video_benchmark = [
    "scikit-image>=0.23.2"
]

umi = [
    "imagecodecs>=2024.1.1"
]

# Documentation
docs = [
    "hf-doc-builder @ git+https://github.com/huggingface/doc-builder.git@main",
    "watchdog>=6.0.0"
]

# Testing
test = [
    "mock-serial>=0.0.1; sys_platform != 'win32'"
]

# Complete installation with all features
all = [
    "lerobot-workspace[dev,feetech,dynamixel,aloha,gamepad,intelrealsense,pusht,xarm,stretch,smolvla,pi0,hilserl,video_benchmark,umi,docs,test]"
]

[tool.setuptools.packages.find]
exclude = [
    "tests*",
    "docs*", 
    "scripts*",
    "*checkpoints*",
]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["tests/artifacts/**/*.safetensors", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.black]
line-length = 110
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pyright]
reportPrivateImportUsage = false

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks", 
    "lerobot/common/datasets/push_dataset_to_hub",
    "lerobot/common/datasets/v2/convert_dataset_v1_to_v2",
    "lerobot/common/policies/pi0/conversion_scripts",
    "lerobot/scripts/push_dataset_to_hub.py",
]
skips = ["B101", "B311", "B404", "B603"]
