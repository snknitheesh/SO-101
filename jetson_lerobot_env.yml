name: lerobot-kinisi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - setuptools
  - ffmpeg
  - pip
  - pip:
      # PyTorch with CUDA 12.8 support
      - torch>=2.5.1 --index-url https://download.pytorch.org/whl/cu128
      - torchvision>=0.20.1 --index-url https://download.pytorch.org/whl/cu128  
      - torchaudio --index-url https://download.pytorch.org/whl/cu128
      
      # Core ML/AI packages
      - transformers>=4.51.3
      - accelerate>=1.2.1
      - einops>=0.8.0
      - datasets>=2.19.0
      - diffusers>=0.27.2
      - huggingface-hub[hf-transfer,cli]>=0.27.1
      
      # Computer Vision
      - opencv-python>=4.8.0
      - timm>=1.0.14
      - albumentations>=1.4.18
      - kornia>=0.7.4
      
      # Data handling
      - h5py>=3.10.0
      - pandas>=2.2.2
      - zarr>=2.17.0
      - pyarrow>=14.0.0
      - fastparquet>=2024.11.0
      
      # Utilities
      - omegaconf>=2.3.0
      - hydra-core>=1.3.2
      - pydantic>=2.10.6
      - PyYAML>=6.0.2
      - tqdm>=4.67.1
      - wandb>=0.16.3
      - matplotlib>=3.10.0
      - scipy>=1.14.0
      - numba>=0.59.0
      
      # Video processing
      - av>=12.3.0
      - imageio[ffmpeg]>=2.34.0
      - decord>=0.6.0
      
      # Robotics specific
      - gymnasium>=0.29.1
      - pymunk>=6.6.0,<7.0.0
      - pyserial>=3.5
      - rerun-sdk>=0.21.0
      
      # Development tools
      - cmake>=3.29.0.1
      - packaging>=24.2
      - termcolor>=2.4.0
      - jsonlines>=4.0.0
      - flask>=3.0.3
      - gdown>=5.1.0
      
      # Specialized packages
      - feetech-servo-sdk>=1.0.0
      - flash-attn==2.7.1.post4 --no-build-isolation
      
      # Local packages (installed as editable)
      - -e ./lerobot/
      - -e ./lerobot/[feetech]
      - -e ./Isaac-GR00T/[orin]

